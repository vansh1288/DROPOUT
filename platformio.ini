[platformio]
default_envs = native

[env:cortex_m4]
build_src_filter = +<src/pqc_engine/*.c> +<src/core_rtos/*.c> +<src/federated/*.c> +<src/network/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-512/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-768/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-1024/clean/*.c> +<deps/pqm4/common/*.c> -<lib/tinycrypt/src/ecc*.c>
platform = ststm32
lib_deps = 
    C:\DROP\lib\tinycrypt
board = nucleo_f446re
framework = stm32cube
build_type = release
lib_ldf_mode = off
build_flags = 
    -std=c99
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-builtin-malloc
    -fno-builtin-calloc
    -fno-builtin-realloc
    -fno-builtin-free
    -fno-exceptions
    -DSTM32F446xx
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1
    -DARM_MATH_MATRIX_CHECK=0
    -DARM_MATH_ROUNDING=0
    -Iinclude
    -Isrc
    -Isrc/core_rtos
    -Isrc/pqc_engine
    -Isrc/federated
    -Isrc/network
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-512/clean
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-768/clean
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-1024/clean
    -Ideps/pqm4/common
    -DUSE_PQM4_KEM768
linker_script = src/core_rtos/memory_linker.ld

[env:esp32c3]
build_src_filter = +<src/pqc_engine/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-512/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-768/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-1024/clean/*.c> +<deps/pqm4/common/*.c>
platform = espressif32
lib_deps = 
    https://github.com/intel/tinycrypt#master
board = esp32-c3-devkitm-1
framework = espidf
build_type = release
build_flags = 
    -std=c99
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-builtin-malloc
    -fno-builtin-calloc
    -fno-builtin-realloc
    -fno-builtin-free
    -fno-exceptions
    -DCONFIG_FREERTOS_HZ=1000
    -Iinclude
    -Isrc
    -Isrc/core_rtos
    -Isrc/pqc_engine
    -Isrc/federated
    -Isrc/network
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-512/clean
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-768/clean
    -Ideps/pqm4/mupq/pqclean/crypto_kem/ml-kem-1024/clean
    -Ideps/pqm4/common
    -DUSE_PQM4_KEM768

[env:native]
build_src_filter = +<src/**/*.c> +<deps/pqm4/pqcrystals/kyber/ref/*.c> +<deps/pqm4/common/*.c>
platform = native
build_type = debug
build_flags = 
    -std=c99
    -O0
    -g
    -fno-builtin-malloc
    -fno-builtin-calloc
    -fno-builtin-realloc
    -fno-builtin-free
    -Iinclude
    -Isrc
    -Isrc/core_rtos
    -Isrc/pqc_engine
    -Isrc/federated
    -Isrc/network
    -Ideps/pqm4/pqcrystals/kyber/ref
    -Ideps/pqm4/common
    -Ideps/pqm4/pqcrystals/kyber
    -Ideps/pqm4/mupq/pqclean/common
    -DUSE_PQM4_KEM768

[env:native_test]
build_src_filter = +<tests/native/test_shamir.c> +<tests/native/test_dma_stream_bridge.c> +<tests/native/test_dma_isr_handler.c> +<tests/native/test_dma_transport.c> +<tests/native/test_packet_codec.c> +<tests/native/test_stream_aggregator.c> +<tests/native/test_dropout_protocol.c> +<tests/native/test_state_machine.c> +<tests/native/test_error_paths.c> +<src/**/*.c> +<deps/pqm4/pqcrystals/kyber/ref/*.c> +<deps/pqm4/common/*.c>
platform = native
build_type = debug
build_flags = 
    -std=c99
    -O0
    -g
    -fno-builtin-malloc
    -fno-builtin-calloc
    -fno-builtin-realloc
    -fno-builtin-free
    -Iinclude
    -Isrc
    -Isrc/core_rtos
    -Isrc/pqc_engine
    -Isrc/federated
    -Isrc/network
    -Ideps/pqm4/pqcrystals/kyber/ref
    -Ideps/pqm4/common
    -Ideps/pqm4/pqcrystals/kyber
    -DUSE_PQM4_KEM768
    -DSHAMIR_DETERMINISTIC_RNG
lib_ldf_mode = off

build_unflags = 
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

