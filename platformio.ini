build_src_filter = +<tests/native/test_kem.c> +<src/**/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-512/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-768/clean/*.c> +<deps/pqm4/mupq/pqclean/crypto_kem/ml-kem-1024/clean/*.c> +<deps/pqm4/common/*.c>
