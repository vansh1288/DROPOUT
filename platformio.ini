    -fno-builtin-malloc
    -fno-builtin-calloc
    -fno-builtin-realloc
    -fno-builtin-free
    -Iinclude
    -Isrc
    -Isrc/core_rtos
    -Isrc/pqc_engine
    -Isrc/federated
    -Isrc/network
    -Ideps/pqm4/pqcrystals/kyber/ref
    -Ideps/pqm4/common
    -Ideps/pqm4/pqcrystals/kyber
    -Ideps/pqm4/mupq/pqclean/common
    -DUSE_PQM4_KEM768
